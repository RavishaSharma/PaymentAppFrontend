<div class="payment-list">
  <mat-card>
    <mat-card-title>Payment Management</mat-card-title>
    <mat-card-content>
      <!-- Search Filters -->
      <form (submit)="searchPayments()" class="search-form">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput [(ngModel)]="filters.payee_first_name" name="payee_first_name" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput [(ngModel)]="filters.payee_last_name" name="payee_last_name" />
        </mat-form-field>
        <!-- <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <input matInput [(ngModel)]="filters.payee_payment_status" name="payee_payment_status" />
        </mat-form-field> -->
        <button mat-raised-button color="primary" type="submit">Search</button>
      </form>

      <!-- Payments Table -->
      <table mat-table [dataSource]="payments" class="mat-elevation-z8">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let payment">
            {{ payment.payee_first_name }} {{ payment.payee_last_name }}
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let payment">{{ payment.status }}</td>
        </ng-container>

        <!-- Due Amount Column -->
        <ng-container matColumnDef="dueAmount">
          <th mat-header-cell *matHeaderCellDef>Due Amount</th>
          <td mat-cell *matCellDef="let payment">{{ payment.due_amount | currency }}</td>
        </ng-container>

        <!-- Total Due Column -->
        <ng-container matColumnDef="totalDue">
          <th mat-header-cell *matHeaderCellDef>Total Due</th>
          <td mat-cell *matCellDef="let payment">{{ payment.total_due | currency }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let payment">
            <button mat-raised-button color="warn" (click)="deletePayment(payment._id)">Delete</button>
            <button mat-raised-button color="primary" *ngIf="payment.evidence_file_id" (click)="downloadEvidence(payment.evidence_file_id)">
              Download Evidence
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Pagination -->
      <mat-paginator
        [length]="totalRecords"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)">
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
